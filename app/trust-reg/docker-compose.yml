# Trust Registration Monitor (TRS / CRBOT)
#
#   cp .env.example .env.local                                  # fill in keys
#   docker compose --env-file .env.local up -d --build       # app on http://localhost:3000
#   docker compose --env-file .env.local run --rm migrator   # prisma migrate deploy (needs DATABASE_URL)
#   docker compose --env-file .env.local --profile jobs up -d cron   # optional in-stack daily scheduler
#
# All configuration, including NEXT_PUBLIC_*, is read at runtime from env_file, so the image needs no
# build args and can be promoted between environments. The npm "docker:*" scripts pass --env-file for you.
# The Dockerfile lives at the repository root (two levels up) so Cloud Run's repository trigger finds it.
#
# The database, auth and storage are the shared AWM Supabase project (or `npm run stack` locally);
# they are not part of this compose file.

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    image: awm/trust-reg:${IMAGE_TAG:-local}
    env_file: .env.local
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  migrator:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrator
    image: awm/trust-reg-migrator:${IMAGE_TAG:-local}
    env_file: .env.local
    profiles: ["tools"]
    # `docker compose run --rm migrator` runs `migrate deploy`; override the command for anything else:
    #   docker compose run --rm migrator migrate status

  # Optional: call the daily job from inside the stack when the host has no scheduler (Cloud Run uses Cloud Scheduler).
  cron:
    image: curlimages/curl:8.10.1
    profiles: ["jobs"]
    env_file: .env.local
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$(date -u +%H:%M)
          if [ "$now" = "${DAILY_JOB_UTC:-06:00}" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" http://app:3000/api/jobs/daily || echo "daily job failed"
            sleep 61
          fi
          sleep 30
        done
    restart: unless-stopped
